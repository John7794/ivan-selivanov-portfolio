<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Badge Frame -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)"/>
  <rect x="14" y="14" width="484" height="484" rx="90" fill="none" stroke="#262626" stroke-width="16"/>

  <!-- Subtle Corner Accents -->
  <rect x="36" y="36" width="14" height="14" fill="#383838"/>
  <rect x="462" y="36" width="14" height="14" fill="#383838"/>
  <rect x="36" y="462" width="14" height="14" fill="#383838"/>
  <rect x="462" y="462" width="14" height="14" fill="#383838"/>

  <!-- Pure Monogram "IS" -->
  <text 
    x="256" 
    y="256" 
    font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace" 
    font-size="240" 
    font-weight="900" 
    letter-spacing="0.04em" 
    fill="#ffffff" 
    text-anchor="middle"
    dominant-baseline="central"
  >IS</text>
</svg>
